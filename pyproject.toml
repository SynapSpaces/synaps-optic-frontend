[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synaps-optic-frontend"
version = "0.3.4"
description = "Synaps Optic Frontend: HTMX/Jinja2 templates and static assets for the Synaps Optic video editor"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "jinja2>=3.1"]
e2e = ["pytest", "jinja2>=3.1", "playwright>=1.45", "pillow"]
video = ["pytest", "jinja2>=3.1", "playwright>=1.45", "pillow", "piper-tts>=1.3"]   # tools/e2e_video.py voice-over

[tool.hatch.build.targets.wheel]
packages = ["optic_frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"   # the Playwright suite runs with: pytest -m e2e
markers = ["e2e: Playwright browser tests (tests/e2e; needs the e2e extra and Chromium)"]
