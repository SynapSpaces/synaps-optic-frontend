{% extends "base.html" %}
{% block container_class %}mx-auto max-w-sm px-6 py-20{% endblock %}
{% block content %}
<div class="card p-8 text-center">
        <h1 class="ss-title mb-2">Check your inbox</h1>
    <p class="ss-body">
        We sent a magic link to <span class="text-fg-1 font-medium">{{ email }}</span>.
        Click it to sign in. Locally, look for it in
        <a href="http://127.0.0.1:54324" class="text-fg-1 underline underline-offset-2 hover:text-fg-2">Inbucket</a>.
    </p>
</div>
{% endblock %}
